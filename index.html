function plan(){

  return S.plan;
}
function rate(type,act,spot,tc){ const d=R.ship[type]; return act==='tc'? tc-d.tcGap : spot-d.spotGap; }

// simulate the year with a given spot rate; returns lines and end cash (before any forced sale)
function simulate(spot, opts={}){
  const b=S.brief, p=plan(), px=b.prices, L=[]; let cash=S.cash;
  let ships=S.ships.map(s=>({...s, loan:s.loan?{...s.loan}:null}));
  ships=ships.filter(s=>{ const a=p.ships[s.id];
    if(a==='sell'||a==='scrap'){ const price=a==='sell'?px[s.type]:R.scrap, bal=s.loan?s.loan.bal:0;
      L.push([(a==='sell'?'Sale of ':'Scrap of ')+s.type+' ship',price]); if(bal) L.push(['Loan paid off from the sale',-bal]);
      cash+=price-bal; return false; }
    s.act=a; return true; });
  const afterSales=cash;
  [['old',p.buyOld],['eco',p.buyEco]].forEach(([t,n])=>{ for(let k=0;k<n;k++){
    const loan=p.loan?px[t]*R.ltv:0; L.push(['Purchase of '+t+' ship',-px[t]]); if(loan) L.push(['Bank loan (50%)',loan]);
    cash-=px[t]-loan; ships.push({id:'n'+t+k,type:t,act:p.newEmp,loan:loan?{orig:loan,bal:loan}:null}); }});
  const afterTrades=cash;
  let rev=0,opex=0,rep=0,int=0;
  ships.forEach(s=>{ const d=R.ship[s.type], oy=d.opex*365;
    if(s.act==='layup') opex+=R.layup*oy; else { rev+=rate(s.type,s.act,spot,b.tc)*d.days; opex+=oy; }
    if(s.loan&&s.loan.bal>0){ const i=s.loan.bal*R.rate, r=Math.min(s.loan.orig*R.amort,s.loan.bal); int+=i; rep+=r; s.loan.bal-=r; }
  });
  const tcShips=ships.filter(s=>s.act==='tc'), spotShips=ships.filter(s=>s.act==='spot');
  if(spotShips.length) L.push(['Spot revenue ('+spotShips.length+' ship'+(spotShips.length>1?'s':'')+')', spotShips.reduce((a,s)=>a+rate(s.type,'spot',spot,b.tc)*R.ship[s.type].days,0)]);
  if(tcShips.length) L.push(['Charter revenue ('+tcShips.length+' ship'+(tcShips.length>1?'s':'')+')', tcShips.reduce((a,s)=>a+rate(s.type,'tc',spot,b.tc)*R.ship[s.type].days,0)]);
  if(opex) L.push([ships.some(s=>s.act==='layup')?'Running costs (incl. lay-up)':'Running costs',-opex]);
  if(rep) L.push(['Loan repayment (10%)',-rep]);
  if(int) L.push(['Loan interest (7%)',-int]);
  cash+=rev-opex-rep-int;
  return {L,cash,afterTrades,afterSales,ships,rev,opex,rep,int};
}

function applyYear(rv){
  S.lastWhy=(S.plan&&S.plan.why)||''; ui.hint=false;
  S.prev=JSON.stringify({...S,prev:null});
  const b=S.brief, sim=simulate(rv.spot), ev={old:rv.endOld,eco:rv.endEco};
  sim.L.forEach(([t,a])=>S.ledger.push({year:b.year,text:t,amt:a}));
  let cash=sim.cash; let ships=sim.ships.map(s=>({id:typeof s.id==='number'?s.id:S.nextId++,type:s.type,loan:s.loan,last:s.act}));
  const forced=[];
  while(cash<0 && ships.length){
    ships.sort((a,c)=>(ev[c.type]-(c.loan?c.loan.bal:0))-(ev[a.type]-(a.loan?a.loan.bal:0)));
    const s=ships.shift(), bal=s.loan?s.loan.bal:0;
    S.ledger.push({year:b.year,text:'Forced sale by the bank: '+s.type+' ship',amt:ev[s.type]});
    if(bal) S.ledger.push({year:b.year,text:'Loan paid off from the forced sale',amt:-bal});
    cash+=ev[s.type]-bal; forced.push(s.type);
  }
  S.cash=cash; S.ships=ships; S.values=ev;
  const nw=cash+ships.reduce((a,s)=>a+ev[s.type],0)-ships.reduce((a,s)=>a+(s.loan?s.loan.bal:0),0);
  S.history.push({year:b.year,spot:rv.spot,nw,forced,cash,tc:b.tc,ffa:b.ffa,prevSpot:b.prevSpot,pStart:{...b.prices},pEnd:{old:rv.endOld,eco:rv.endEco}});
  if(rv.next){ S.brief={...rv.next,prices:{old:rv.endOld,eco:rv.endEco}}; S.plan=null; }
  else { S.done=true; S.plan=null; }
  save();
}

function netWorth(){
  const v=S.values||S.brief.prices;
  return S.cash+S.ships.reduce((a,s)=>a+v[s.type],0)-loanBal();
}

function torn(seed,top,bottom){
  let s=seed; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  const pts=[]; const n=26;
  for(let i=0;i<=n;i++){ const x=(i/n*100).toFixed(1); pts.push(x+'% '+(top?(rnd()*1.6).toFixed(2):'0')+'%'); }
  for(let i=n;i>=0;i--){ const x=(i/n*100).toFixed(1); pts.push(x+'% '+(bottom?(100-rnd()*1.8).toFixed(2):'100')+'%'); }
  return 'clip-path:polygon('+pts.join(',')+')';
}

function planner(){
  const b=S.brief, p=plan(), px=b.prices;
  const opts=(t,v)=>[['spot','Spot'],['tc','1-year charter'],['layup','Lay-up'],['sell','Sell at '+fm(px[t])],...(t==='old'?[['scrap','Scrap for '+fm(R.scrap)]]:[])]
     .map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('');
  const sim=simulate(+p.guess||0);
  const tooMuch=sim.afterTrades< -1;
  const sc=[p.guess-4000,+p.guess,+p.guess+4000].map(g=>({g,c:simulate(g).cash}));
  // which ship types will the team manage this year? the guess is shown in the matching ship's terms
  const kept=S.ships.filter(s=>!['sell','scrap'].includes(p.ships[s.id])).map(s=>s.type);
  if(p.buyOld) kept.push('old'); if(p.buyEco) kept.push('eco');

const BAND={start:'#8a94a6',2027:'#1f9aa8',2028:'#7b61d1',2029:'#d0559a',2030:'#b08d2a'};

function lineChart(o){

  lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st; if(hi===lo) hi=lo+st;
  const n=o.labels.length, x=i=>L+(n===1?iw/2:i*iw/(n-1)), y=v=>T+ih-(v-lo)/(hi-lo)*ih;

  const xl=o.labels.map((l,i)=>`<text x="${x(i)}" y="${H-10}" class="ct" text-anchor="middle">${esc(l)}</text>`).join('');
  const lastIdx=s=>{ for(let i=s.values.length-1;i>=0;i--) if(s.values[i]!=null) return i; return -1; };
  const ends=o.series.map(s=>{const i=lastIdx(s); return {s,i,yy:y(s.values[i])};}).filter(e=>e.i>=0).sort((a,b)=>a.yy-b.yy);
  for(let k=1;k<ends.length;k++) if(ends[k].yy-ends[k-1].yy<16) ends[k].yy=ends[k-1].yy+16;
  const lines=o.series.map(s=>`<polyline points="${s.values.map((v,i)=>v==null?null:x(i)+','+y(v)).filter(Boolean).join(' ')}" class="cl ${s.cls}${s.dash?' dash':''}"/>`+
      s.values.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="${s.dash?4:4.5}" class="cd ${s.cls}${s.dash?' hollow':''}"/>`).join('')).join('');
  const lab=o.noEnd?'':ends.map(e=>`<text x="${x(e.i)+9}" y="${e.yy+4}" class="cv">${esc(e.s.name)} ${o.fmt(e.s.values[e.i])}</text>`).join('');
  const stepw=n===1?iw:iw/(n-1);
  const bands=(o.notes||[]).map(nt=>{ const x0=Math.max(x(nt.i)-stepw/2,L-14), x1=Math.min(x(nt.i)+stepw/2,L+iw+14);
    return `<rect x="${x0}" y="${T-8}" width="${x1-x0}" height="${ih+8}" rx="6" fill="${bandCol(nt.key)}" class="yband"/>`; }).join('');

}
function barChart(o){
  const W=440,H=240,L=40,Rr=10,T=28,B=34, iw=W-L-Rr, ih=H-T-B;
  const all=o.series.flatMap(s=>s.values).filter(v=>v!=null), hi=Math.max(1,Math.ceil(Math.max(...all)));
  const y=v=>T+ih-v/hi*ih, n=o.labels.length, gw=iw/n, bw=Math.min(34,(gw-16)/o.series.length);
  const ticks=[]; for(let v=0; v<=hi; v+=1) ticks.push(v);

      const top=y(v), h=Math.max(1,y(0)-top), r=Math.min(4,h);
      bars+=`<path d="M${bx},${y(0)} V${top+r} Q${bx},${top} ${bx+r},${top} H${bx+bw-r} Q${bx+bw},${top} ${bx+bw},${top+r} V${y(0)} Z" class="cb ${s.cls}"/>`+
            `<text x="${bx+bw/2}" y="${top-5}" class="cv sm" text-anchor="middle">${o.fmt(v)}</text>`;
      tops[i].push([bx+bw/2, top-18]); });
  });
  const xl=o.labels.map((l,i)=>`<text x="${L+i*gw+gw/2}" y="${H-10}" class="ct" text-anchor="middle">${esc(l)}</text>`).join('');
  const bands=(o.notes||[]).map(nt=>`<rect x="${L+nt.i*gw+3}" y="${T-20}" width="${gw-6}" height="${ih+20}" rx="6" fill="${bandCol(nt.key)}" class="yband"/>`).join('');

  <div class="annot"><div><h3 class="ch3">Ship prices</h3>${lg([['eco','Eco'],['old','Old']])}${priceChart}</div>${hintList(pHints)}</div>
  <div class="annot"><div><h3 class="ch3">FFA forecast vs actual spot (per day)</h3><div class="clegend"><span><i class="sw eco"></i>Eco actual</span><span><i class="sw ecod"></i>Eco FFA</span><span><i class="sw old"></i>Old actual</span><span><i class="sw oldd"></i>Old FFA</span></div>${ffaChart}<p class="note">Solid lines are what happened, dashed lines are the forecast. Old ships always earn $4,000 a day less than eco on spot: a fixed simplifying assumption, so the orange lines run parallel to the blue ones.</p></div>${hintList(fHints)}</div>
  <div class="annot"><div><h3 class="ch3">Supply vs demand (growth per year)</h3>${lg([['fleet','Fleet growth (supply)'],['dem','Cargo demand']])}${sdChart}</div>${hintList(sHints)}</div>
  </details>`;
}
function hintBox(){
  const b=S.brief, y=b.year, last=y>=2029, tg=R.ship.old.tcGap, gap=R.ship.old.spotGap;
  const pct=v=>parseFloat(String(v).replace('%','').replace('+',''));
  const f=pct(b.fleet), d=pct(b.demand);
  const items=[];
  items.push(`<b>FFA ${fk(b.ffa)} for ${y}</b> (old ship ${fk(b.ffa-gap)}) is ${b.ffa<b.tc?'below':'above'} the charter offer of ${fk(b.tc)}: `+
    (b.ffa<b.tc?(b.ffa<b.prevSpot?'the market expects spot to be even worse than the charter pays.':'the market expects spot to pay less than the charter, so the charter is the safer income.'):'the market expects spot to pay more than the charter.'));
  items.push(`<b>FFA ${fk(b.ffaNext)} for ${y+1}</b> (old ship ${fk(b.ffaNext-gap)}): `+
    (b.ffaNext>b.ffa
      ? (last?'the market expects the recovery to continue, which supports ship values at the end of the game.':'the market expects a recovery, so cash now means buying cheap later.')
      : 'the market expects rates to fall next year, so think about when to sell.'));
  items.push(`<b>Fleet ${esc(b.fleet)} vs cargo demand ${esc(b.demand)} in ${y}</b>: `+
    (f>d?'more new ships than new cargo, so rates tend to fall.':'cargo grows faster than the fleet, so rates tend to rise.'));
  items.push(`<b>Fleet ${esc(b.fleetNext)} in ${y+1}</b> (order book): `+
    (pct(b.fleetNext)>=4?'a lot of new ships are coming, which usually pushes rates down.':'few new ships are coming, which usually supports rates.'));
  return `<div class="hintbox" role="note"><p class="eyebrow" style="margin-bottom:6px">Hint · reading the ${y} forecasts</p><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul><p class="note" style="margin:8px 0 0">Forecasts are often wrong. Use them to size your bet, not to bet everything.</p></div>`;
}

function lastResult(){
  if(!S.history.length) return '';
  const h=S.history[S.history.length-1], prevNw=S.history.length>1?S.history[S.history.length-2].nw:R.startCash;
  return `<section class="card" style="border-color:var(--gold)"><p class="eyebrow">${h.year} · Your result</p>
  <h2>Average spot was ${fk(h.spot)} a day. Net worth ${fm(h.nw)} <span class="${h.nw>=prevNw?'good':'bad'}">(${h.nw>=prevNw?'+':''}${fm(h.nw-prevNw)})</span></h2>
  ${h.forced.length?`<p class="warn">You ran out of cash. The bank sold: ${h.forced.join(', ')} ship${h.forced.length>1?'s':''}.</p>`:''}
  ${S.done?`<p style="margin:0">Game over. Tell the game master your net worth: <b class="num">${fm(h.nw)}</b>, a return of <b class="num">${((h.nw/R.startCash-1)*100).toFixed(0)}%</b> on ${fm(R.startCash)}.</p>`:''}
  </section>`;
}
function statement(){
  let bal=0, cur=null; const rows=[];
  S.ledger.forEach(e=>{ bal+=e.amt; if(e.year!==cur){ cur=e.year; rows.push(`<tr class="yr"><td colspan="3">${esc(String(e.year))}</td></tr>`);}
    rows.push(`<tr><td>${esc(e.text)}</td><td class="num ${e.amt<0?'bad':''}">${e.amt>=0?'+':''}${fm(e.amt)}</td><td class="num">${fm(bal)}</td></tr>`); });
  return `<section class="card"><p class="eyebrow">Bank statement</p><h2>Every dollar in and out</h2>
  <div class="tbl"><table><tr><th>Transaction</th><th>Amount</th><th>Balance</th></tr>${rows.join('')}</table></div>
  <p class="note">Loans outstanding: ${fm(loanBal())}. ${S.ships.map(s=>`${s.type} ship loan ${fm(s.loan?s.loan.bal:0)}`).join(' · ')}</p></section>`;
}
function footer(){
  return `<section class="row" style="justify-content:space-between">
   ${S.prev?`<button class="btn ghost" id="undo">Undo the last year</button>`:'<span></span>'}
   ${ui.confirm==='reset'?`<span class="row"><span class="bad">Erase this team’s account?</span><button class="btn danger" id="resetYes">Erase</button><button class="btn ghost" id="resetNo">Keep</button></span>`
     :`<button class="btn ghost" id="reset">New game</button>`}</section>
   <p class="note">Your account is saved in this browser. Keep this page open during the game.</p>`;
}
const INTRO={2027:'intro-2027-r7k2.html',2028:'intro-2028-m4q9.html',2029:'intro-2029-x8d3.html'};
let introShaken=null;
function introButton(){
  const a=document.getElementById('introBtn'); if(!a) return;
  const y=S.done?null:S.brief.year;
  if(!y||!INTRO[y]){ a.parentElement.style.display='none'; return; }
  a.parentElement.style.display=''; a.href=INTRO[y];
  a.textContent='ROUND '+(y-2026)+' · '+y+' — INTRODUCTION OF THE ROUND – READ BEFORE YOU START';
  if(introShaken!==y){ a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); introShaken=y; }
}
function render(){
  tiles(); introButton();
  document.getElementById('app').innerHTML = lastResult() + (S.done? trackerCard() : news()+marketBrief()+trackerCard()+planner()+submit()+reveal()) + statement() + footer();
}

// ---------- events
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.buy){ const [k,d]=b.dataset.buy.split('.'); const p=plan(); p[k]=Math.max(0,Math.min(5,p[k]+ +d)); save(); render(); return; }
  switch(b.id){
    case 'unlock': {
      const code=(document.getElementById('code').value||'').trim(), y=String(S.brief.year), lk=LOCK[y];
      let ok=false; try{ ok=btoa(code)===lk.c; }catch(err){}
      if(!ok){ ui.codeMsg='That code doesn’t match. Check the number on the screen.'; render(); return; }
      const rv=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(lk.d),ch=>ch.charCodeAt(0)))); ui.codeMsg=''; ui.copied=''; applyYear(rv); render(); window.scrollTo(0,0); break; }
    case 'hintBtn': ui.hint=!ui.hint; render(); break;
    case 'undo': { const p=JSON.parse(S.prev); S=p; save(); render(); break; }
    case 'reset': ui.confirm='reset'; render(); break;
    case 'resetNo': ui.confirm=null; render(); break;
    case 'resetYes': { const n=S.name; S=fresh(); S.name=n; ui.confirm=null; save(); render(); break; }
    case 'copy': {
      const txt='To: '+GM_EMAIL+'\nSubject: '+S.name+' – '+S.brief.year+'\n\n'+decisionText();
      const done=m=>{ui.copied=m;render();};
      try{ navigator.clipboard.writeText(txt).then(()=>done('Copied. Paste it into a new email to '+GM_EMAIL+'.'),()=>done('Copy did not work here. Write the email by hand from the box above.')); }catch(err){ done('Copy did not work here. Write the email by hand from the box above.'); }
      break; }
  }
});
// build the email link at the moment of the click, so it always carries the latest name and plan
app.addEventListener('click',e=>{
  const a=e.target.closest('a.mail'); if(!a) return;
  const tn=document.getElementById('teamName'); const v=(tn.value||'').trim();
  if(v && v!==S.name){ S.name=v; save(); }
  if(!S.name||S.name===DEFAULT_NAME){ e.preventDefault(); render(); return; }
  a.href=mailLinks()[a.dataset.kind];
},true);
app.addEventListener('toggle',e=>{ if(e.target.classList&&e.target.classList.contains('guide')){ if(!ui.guideOpen) ui.guideOpen={}; ui.guideOpen[e.target.dataset.year]=e.target.open; } },true);

// chart hover / tap: crosshair + tooltip
function chartHover(e){
  const r=e.target.closest&&e.target.closest('rect.ch'); const wrap=e.target.closest&&e.target.closest('.chartwrap');
  document.querySelectorAll('.chartwrap').forEach(w=>{ if(w!==wrap){ const t=w.querySelector('.ctip'); if(t) t.style.opacity=0; const c=w.querySelector('.cx'); if(c) c.style.display='none'; }});
  if(!r||!wrap) return;
  const svg=wrap.querySelector('svg'), tip=wrap.querySelector('.ctip'), cx=svg.querySelector('.cx');
  const xs=+r.dataset.x; cx.setAttribute('x1',xs); cx.setAttribute('x2',xs); cx.style.display='';
  const scale=svg.getBoundingClientRect().width/440;
  tip.textContent=r.dataset.tip; tip.style.left=Math.min(Math.max(xs*scale,90),svg.getBoundingClientRect().width-90)+'px'; tip.style.top='-8px'; tip.style.opacity=1;
}
app.addEventListener('pointermove',chartHover); app.addEventListener('pointerdown',chartHover);
app.addEventListener('toggle',e=>{ if(e.target.classList&&e.target.classList.contains('results')) ui.resultsOpen=e.target.open; },true);
function refreshPreview(){
  const pv=document.getElementById('mailPreview'), sj=document.getElementById('mailSubject');
  if(pv) pv.textContent=decisionText();
  if(sj) sj.textContent=S.name+' – '+S.brief.year;
}
app.addEventListener('input',e=>{
  if(e.target.id==='why'){ plan().why=e.target.value; save(); refreshPreview(); }
});
app.addEventListener('change',e=>{
  const el=e.target, p=S.done?null:plan();
  if(el.dataset.ship){ p.ships[el.dataset.ship]=el.value; }
  else if(el.id==='loan'){ p.loan=el.checked; }
  else if(el.id==='newEmp'){ p.newEmp=el.value; }
  else if(el.id==='guess'){ const v=parseFloat(el.value); p.guess=isNaN(v)?S.brief.ffa:Math.max(0,v+(el.dataset.type==='old'?R.ship.old.spotGap:0)); }
  else if(el.id==='why'){ p.why=el.value; save(); return; }
  else return;
  save(); render();
});
app.addEventListener('keydown',e=>{ if(e.target.id==='code'&&e.key==='Enter'){ document.getElementById('unlock')?.click(); } });
document.getElementById('teamName').addEventListener('change',e=>{
  const wasDefault=!S.name||S.name===DEFAULT_NAME;
  S.name=e.target.value.trim()||DEFAULT_NAME; save();
  const isDefault=S.name===DEFAULT_NAME;
  if(wasDefault!==isDefault) setTimeout(render,0); else refreshPreview();
});

function start(data){ S=(data&&data.S)||load()||fresh(); render(); }
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
